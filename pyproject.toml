[project]
name = "mlops-data-puchkova"
version = "0.1.0"
description = "Practice 3: reproducible data versioning with DVC and ClearML"
authors = [
    {name = "Puchkova", email = "ya_nika2006@mail.ru"}
]
requires-python = "==3.12.*"
dependencies = [
    "clearml==2.1.3",
    "dvc==3.63.0",
    "pandas==3.0.1",
    "pathspec==0.12.1",
    "scikit-learn==1.8.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

